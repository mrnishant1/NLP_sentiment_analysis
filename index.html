<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #fff;
            color: #000;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(100%, 400px);
            padding: 24px;
            border: 2px solid #000;
            border-radius: 10px;
            background: #fff;
        }

        h1 { margin: 0 0 22px; font-size: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 10px;
            border: 1px solid #000;
            border-radius: 4px;
            resize: vertical;
            color: #000;
            font: inherit;
        }

        button {
            width: 100%;
            margin: 14px 0 20px;
            padding: 11px;
            border: 1px solid #000;
            border-radius: 4px;
            background: #000;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: bold;
        }

        button:hover:not(:disabled) { background: #333; }
        button:disabled { opacity: .6; cursor: wait; }

        .output {
            min-height: 68px;
            padding: 14px;
            border: 1px solid #000;
            border-radius: 4px;
        }

        .output-label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: bold; }
        #output { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sentiment Analyzer</h1>

        <label for="sentiment_text">Text</label>
        <textarea id="sentiment_text" rows="5" placeholder="Enter text to analyze..."></textarea>

        <button id="analyze_button" type="button">Analyze</button>

        <div class="output" aria-live="polite">
            <span class="output-label">Result</span>
            <div id="output">—</div>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('sentiment_text');
        const button = document.getElementById('analyze_button');
        const output = document.getElementById('output');

        function displaySentiment(value) {
            const sentiment = String(value).toLowerCase();
            if (sentiment.includes('positive')) output.textContent = '😊 Positive';
            else if (sentiment.includes('negative')) output.textContent = '😞 Negative';
            else if (sentiment.includes('neutral')) output.textContent = '😐 Neutral';
            else output.textContent = value;
        }

        button.addEventListener('click', async () => {
            const prompt = textarea.value.trim();

            if (!prompt) {
                output.textContent = 'Enter some text first.';
                textarea.focus();
                return;
            }

            button.disabled = true;
            button.textContent = 'Analyzing...';
            output.textContent = '...';

            try {
                const response = await fetch('http://127.0.0.1:3000/analyse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!response.ok) throw new Error('Request failed');

                const payload = await response.json();
                displaySentiment(Array.isArray(payload.data) ? payload.data[1] : payload.data);
            } catch (error) {
                output.textContent = 'Could not analyze text.';
            } finally {
                button.disabled = false;
                button.textContent = 'Analyze';
            }
        });
    </script>
</body>
</html>
