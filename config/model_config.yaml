# config.yaml
seq_len: 64
d_model: 96
n_heads: 8
ff_hidden: 256
seed: 42
pad_idx: 0

mlm:
  epochs: 6
  batch_size: 32
  lr: 0.0001

sentiment:
  epochs: 15
  batch_size: 32
  lr: 0.00003
  num_classes: 3

paths:
  raw_data: "./raw_data/data.csv"
  validated_data: "./artifacts/validated_data.csv"
  train_data: "./artifacts/train.csv"
  test_data: "./artifacts/test.csv"

  vocab: "./artifacts/vocab.json"
  mlm_checkpoint: "./artifacts/mini_bert_mlm.pth"
  sentiment_checkpoint: "./artifacts/sentiment_model.pth"