[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-engine"
version = "0.1.0"
description = "Modular text preprocessing and model training project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
search_engine = ["config/*.yaml"]
